/* Layout: full-bleed 3D stage. HUD pinned to the edges: room title top-left, map + visitor count top-right,
   joystick bottom-left, touch button bottom-right. One committed dark gallery look. */
:root{
  --bg:#0e1016;
  --fg:#f3efe6;
  --muted:#b9b3a6;
  --panel:rgba(14,16,22,.66);
  --line:rgba(243,239,230,.2);
  --accent:#ffb347;
  --accent-ink:#1a1204;
  --font-display:"Young Serif",Georgia,"Times New Roman",serif;

  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));

  font:500 14px/1.4 var(--font-ui);
  overflow:hidden;touch-action:none;

  -webkit-tap-highlight-color:transparent;
}
#stage{position:fixed;inset:0;z-index:0;background:var(--bg)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.hud{position:fixed;z-index:5;pointer-events:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}

#place{top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));max-width:min(62vw,340px)}
#place .k{font:700 11px/1 var(--font-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
#place .n{font:400 30px/1.05 var(--font-display);margin-top:6px;text-wrap:balance;text-shadow:0 2px 14px rgba(0,0,0,.55)}
#caption{margin-top:12px;padding:9px 13px 10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#caption .t{font:400 17px/1.2 var(--font-display)}
#caption .s{margin-top:3px;font:700 11px/1.2 var(--font-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

#mini{top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:grid;justify-items:end;gap:7px}
#map{width:92px;height:92px;display:block;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
#count{font:700 12px/1 var(--font-ui);padding:6px 10px;border-radius:99px;background:var(--panel);border:1px solid var(--line)}

#joy{
  pointer-events:auto;touch-action:none;
  left:max(16px,env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));
  width:130px;height:130px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.07) 0 38%,transparent 39%),var(--panel);
  border:1px solid var(--line);
}
#joy::before,#joy::after{content:"";position:absolute;background:var(--line);left:50%;top:50%}
#joy::before{width:1px;height:70%;transform:translate(-50%,-50%)}
#joy::after{height:1px;width:70%;transform:translate(-50%,-50%)}
#knob{position:absolute;z-index:1;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:var(--accent);box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 -6px 0 rgba(0,0,0,.14)}

#touch{
  right:max(16px,env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));
  display:grid;justify-items:center;gap:9px;
}
#touchBtn{
  pointer-events:auto;touch-action:none;
  width:88px;height:88px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;
  background:var(--panel);color:var(--muted);border:2px solid var(--line);
  transition:background .18s,color .18s,border-color .18s,box-shadow .18s,transform .12s;
}
#touchBtn svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#touchBtn .ic-shrink{display:none}
#touchBtn.open .ic-expand{display:none}
#touchBtn.open .ic-shrink{display:block}
#touchBtn.ready{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 0 0 7px rgba(255,179,71,.24)}
#touchBtn:active{transform:scale(.94)}

#hint.gone{opacity:0}
#toast{left:50%;transform:translateX(-50%);top:46%;padding:9px 15px;background:var(--panel);border:1px solid var(--line);border-radius:99px;font-weight:700;font-size:13px;transition:opacity .25s;opacity:0}

#loading{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:var(--bg);text-align:center}
#loading .box{display:grid;gap:16px;justify-items:center;padding:0 24px}
#loading .bar{width:150px;height:3px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
#loading .bar::after{content:"";position:absolute;inset:0;width:45%;background:var(--accent);border-radius:3px;animation:slide 1s ease-in-out infinite}
#loading p{margin:0;font:400 20px/1.3 var(--font-display);text-wrap:balance}
#loading.failed .bar{display:none}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
@media (prefers-reduced-motion:reduce){#loading .bar::after{animation:none;width:100%}#hint,#toast{transition:none}}

#gp{left:50%;transform:translateX(-50%);bottom:calc(228px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;pointer-events:auto}
#gp[hidden],#gm[hidden],#mf[hidden],#chp[hidden]{display:none}
#gp button{padding:12px 16px;border-radius:99px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px}
#gm,#mf{position:fixed;inset:0;z-index:20;background:rgba(14,16,22,.97);display:flex;flex-direction:column;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 10px 20px;overflow:auto;touch-action:pan-y}
.gh{display:flex;gap:10px;align-items:center;width:min(94vw,440px)}.gh b{font:400 20px var(--font-display);flex:1}.gh button,#gb .ac,.mfc .ac{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:700}
#gs{width:min(94vw,440px);text-align:center;color:var(--accent);font-weight:700;min-height:20px}
#gb{width:min(94vw,440px);display:grid;gap:10px;justify-items:center}
.bd{display:grid;width:100%;aspect-ratio:1;border:2px solid var(--line)}.bd button{border:0;padding:0;font-size:min(8vw,34px);line-height:1;display:grid;place-items:center;aspect-ratio:1}
.bd.c4{aspect-ratio:7/6}.bd.c4 button{border-radius:50%;margin:3px;background:#0b1740}
.cs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.cd{min-width:46px;padding:12px 6px;border-radius:8px;border:1px solid #888;background:#f3efe6;color:#111;font:700 17px var(--font-ui)}.cd.r{color:#c0272d}.cd.on{outline:3px solid var(--accent)}.cd.off{opacity:.45}
.big{font-size:26px;letter-spacing:2px;text-align:center}

#side{left:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;pointer-events:auto}
#side button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:22px}
#chp{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:21;background:rgba(14,16,22,.96);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:min(92vw,380px)}
#chp button{padding:8px 2px;border-radius:12px;border:2px solid var(--line);background:var(--panel);font-size:11px}#chp button.on{border-color:var(--accent)}#chp i{display:block;font-style:normal;font-size:26px}
.mfc{width:min(94vw,440px);display:grid;gap:10px}.mfc input{padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:inherit;font-size:16px;min-width:0}
.pl{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);text-align:left;color:inherit}.pl.on{border-color:var(--accent)}.pl.dead{opacity:.4}
.er{color:#ff8a8a;min-height:18px}.lg{font-size:13px;max-height:130px;overflow:auto;display:grid;gap:3px}.mfc button:disabled{opacity:.5}

#emp{position:fixed;left:64px;top:50%;transform:translateY(-50%);z-index:7;display:grid;grid-template-columns:repeat(4,56px);gap:6px;padding:8px;border-radius:14px;background:rgba(14,16,22,.92);border:1px solid var(--line)}
#bvc.on{border-color:#4ade80;box-shadow:0 0 0 2px rgba(74,222,128,.45)}
#emp[hidden]{display:none}#emp button{padding:6px 2px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:inherit;font-size:22px;line-height:1.1}#emp small{display:block;font-size:9px;opacity:.8}
</style>

function skyGradient(ctx,W,Hh,stops,until){var g=ctx.createLinearGradient(0,0,0,until);for(var i=0;i<stops.length;i++)g.addColorStop(i/(stops.length-1),stops[i]);ctx.fillStyle=g;ctx.fillRect(0,0,W,Hh);}

      ch.root.position.set(Math.sin(a)*3,0,Math.cos(a)*3);ch.root.rotation.y=a+Math.PI;MV.sc.add(ch.root);
      MV.seats.push({id:p.id,ch:ch,a:a,i:i,lb:null,lk:"",bs:null});});
  }
  var night=S.ph==="night";
  MV.sc.background=new THREE.Color(night?0x070a14:0x2d4066);MV.amb.intensity=night?.35:.9;MV.dir.intensity=night?.25:.8;
  S.pl.forEach(function(p,i){var s=MV.seats[i];if(!s)return;
    var txt=(p.alive?"":"☠ ")+p.nick+(p.id===S.me.id?" (siz)":"")+(p.role?" "+RL[p.role].split(" ")[0]:"")+(p.votes?" 🗳"+p.votes:"");
    if(txt!==s.lk){if(s.lb)MV.sc.remove(s.lb);s.lb=makeLabel(txt.slice(0,22));s.lb.scale.set(1.9,.475,1);s.lb.position.set(Math.sin(s.a)*3,p.alive?2.45:.9,Math.cos(s.a)*3);MV.sc.add(s.lb);s.lk=txt;}
    s.ch.root.visible=p.alive;});
  var mq=0;S.chat.forEach(function(c){if(c.q>mq)mq=c.q;});
  if(MV.lq==null)MV.lq=mq;
  S.chat.forEach(function(c){if(c.q>MV.lq){var s=MV.seats.filter(function(x){return x.id===c.i;})[0];
    if(s){if(s.bs)MV.sc.remove(s.bs);s.bs=mvBub(c.t);s.bs.position.set(Math.sin(s.a)*3,3.2,Math.cos(s.a)*3);MV.sc.add(s.bs);MV.bub[c.i]=Date.now()+6000;}}});
  MV.lq=Math.max(MV.lq,mq);
  var mi=0;S.pl.forEach(function(p,i){if(p.id===S.me.id)mi=i;});MV.am=n?Math.PI*2*mi/n:0;
  if(!MV.on){MV.on=true;mvLoop();}
}
function mvLoop(){
  if(!MV.on||mfEl.hidden||mfV.hidden){MV.on=false;return;}
  requestAnimationFrame(mvLoop);
  var t=performance.now()/1000,w=mfV.clientWidth,h=mfV.clientHeight;
  if(w&&h&&(MV.w!==w||MV.h!==h)){MV.r.setSize(w,h,false);MV.cam.aspect=w/h;MV.cam.updateProjectionMatrix();MV.w=w;MV.h=h;}
  var a=MV.am+Math.sin(t*.3)*.12;
  MV.cam.position.set(Math.sin(a)*7.8,4.8,Math.cos(a)*7.8);MV.cam.lookAt(0,1.1,0);
  MV.seats.forEach(function(s){var sp=MV.bub[s.id]>Date.now();animateChar(s.ch,0,0,t+s.i,sp?1:0);if(s.bs&&!sp){MV.sc.remove(s.bs);s.bs=null;}});
  MV.r.render(MV.sc,MV.cam);
}
function mfDraw(){
  if(mfEl.hidden)return;
  var sv={},fc=document.activeElement&&document.activeElement.id,S=MFS.s;
  ["mn","mr","mp","mci"].forEach(function(id){var e=$(id);if(e)sv[id]=e.value;});
  var h='<div class="gh"><b>🎭 Mafiya</b><button id="mfx">Yopish</button></div><div class="mfc">';
  if(!S){
    h+='<div>Kamida 5, ko\'pi bilan 10 kishi. Avval xona yarating va parol qo\'ying; do\'stlaringiz shu nom va parol bilan kiradi.</div><input id="mn" placeholder="Ismingiz" maxlength="16"><input id="mr" placeholder="Xona nomi" maxlength="24"><input id="mp" type="password" placeholder="Parol (kamida 3 belgi)" maxlength="64"><div class="cs"><button class="ac" data-m="create">Xona yaratish</button><button class="ac" data-m="join">Xonaga kirish</button></div>';
  }else{
    var me_=S.me,act=me_.alive&&(S.ph==="day"||(S.ph==="night"&&me_.role!=="civ")),left=Math.max(0,S.left-Math.floor((Date.now()-MFS.t0)/1000));
    var hint={mafia:"Qurbonni tanlang",doc:"Kimni davolaysiz?",det:"Kimni tekshirasiz?",civ:"Uxlayapsiz… 😴"}[me_.role];
    h+='<div><b>Xona: '+mfe(S.n)+'</b> · '+S.pl.length+'/10</div><div class="big" style="font-size:20px">'+{lobby:"Kutish xonasi",night:"🌙 Tun",day:"☀️ Kun: muhokama va ovoz",end:"O'yin tugadi"}[S.ph]+((S.ph==="night"||S.ph==="day")?' · <span id="mft">'+left+'</span>s':'')+'</div>';
    if(me_.role&&S.ph!=="lobby")h+='<div>Rolingiz: <b>'+RL[me_.role]+'</b>'+(me_.alive?'':' (o\'ldingiz)')+' · '+(S.ph==="night"?hint:S.ph==="day"?"Gumon qilganingizga ovoz bering":"")+'</div>';
    h+=S.pl.map(function(p){
      var ok=act&&p.alive&&(S.ph==="day"?p.id!==me_.id:me_.role==="mafia"?p.role!=="mafia":me_.role==="det"?p.id!==me_.id:true);
      return '<button class="pl'+(p.alive?'':' dead')+(me_.pick===p.id?' on':'')+'" '+(ok?'data-t="'+p.id+'"':'disabled')+'>'+mfe(p.nick)+(p.id===me_.id?' (siz)':'')+(p.role?' · '+RL[p.role]:'')+(p.votes?' · 🗳'+p.votes:'')+(p.alive?'':' ☠')+'</button>';}).join("");
    if(S.ph==="lobby"||S.ph==="end")h+=S.host?'<button class="ac" data-m="start"'+(S.pl.length<5?' disabled':'')+'>Boshlash ('+S.pl.length+'/5 dan kam bo\'lmasin)</button>':'<div>Boshlovchini kuting… (kamida 5 kishi kerak)</div>';
    h+='<div class="lg">'+S.log.concat(me_.priv||[]).map(function(x){return '<div>'+mfe(x)+'</div>';}).join("")+'</div><div class="lg">'+S.chat.map(function(c){return '<div><b>'+mfe(c.n)+':</b> '+mfe(c.t)+'</div>';}).join("")+'</div>';
    h+='<div class="cs"><input id="mci" placeholder="Xabar…" maxlength="140" style="flex:1"><button class="ac" id="mcs">➤</button></div><button class="ac" data-m="leave">Xonadan chiqish</button>';
  }
  try{mvSync(S);}catch(e){mfV.hidden=true;MV.on=false;if(window.console)console.error(e);}
  mfU.innerHTML=h+'<div class="er">'+mfe(MFS.err)+'</div></div>';
  for(var k in sv){var e=$(k);if(e)e.value=sv[k];}
  if(fc&&$(fc))$(fc).focus();
}
function mfChat(){var i=$("mci");if(i&&i.value.trim()){mfTx({t:"mf_chat",text:i.value});i.value="";}}
mfEl.onclick=function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.id==="mfx")mfEl.hidden=true;
  else if(b.id==="mcs")mfChat();
  else if(b.dataset.m==="create"||b.dataset.m==="join")mfTx({t:"mf_"+b.dataset.m,nick:$("mn").value||CH[myC].n,name:$("mr").value,pw:$("mp").value,c:myC});
  else if(b.dataset.m)mfTx({t:"mf_"+b.dataset.m});
  else if(b.dataset.t)mfTx({t:"mf_act",to:b.dataset.t});
};
mfEl.onkeydown=function(e){if(e.key==="Enter"&&e.target.id==="mci")mfChat();};
setInterval(function(){var e=$("mft");if(e&&MFS.s)e.textContent=Math.max(0,MFS.s.left-Math.floor((Date.now()-MFS.t0)/1000));},1000);

/* ------------------------------------------------------------------ start */
function start(){
  try{
    meDot=document.createElementNS(NS,"circle");meDot.setAttribute("r","1.5");meDot.setAttribute("fill","#ffb347");meDot.setAttribute("stroke","#0e1016");meDot.setAttribute("stroke-width",".45");dotsEl.appendChild(meDot);

    hintTimer=setTimeout(function(){var h=$("hint");h.classList.add("gone");setTimeout(function(){h.hidden=true;},700);},14000);
    loadingEl.hidden=true;
    last=performance.now();
    requestAnimationFrame(frame);
    connectRoom();
  }catch(err){
    fail("Muzeyni yaratishda xatolik chiqdi. Sahifani qayta oching.");
    if(window.console)console.error(err);
  }
}

})();
