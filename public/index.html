<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pingvin Muzeyi</title>

<style>
/* Layout: full-bleed 3D stage. HUD pinned to the edges: room title top-left, map + visitor count top-right,
   joystick bottom-left, touch button bottom-right. One committed dark gallery look. */
:root{
  --bg:#0e1016;
  --fg:#f3efe6;
  --muted:#b9b3a6;
  --panel:rgba(14,16,22,.66);
  --line:rgba(243,239,230,.2);
  --accent:#ffb347;
  --accent-ink:#1a1204;
  --font-display:"Young Serif",Georgia,"Times New Roman",serif;
  --font-ui:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--bg);color:var(--fg);
  font:500 14px/1.4 var(--font-ui);
  overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
}
#stage{position:fixed;inset:0;z-index:0;background:var(--bg)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.hud{position:fixed;z-index:5;pointer-events:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}

#place{top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));max-width:min(62vw,340px)}
#place .k{font:700 11px/1 var(--font-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
#place .n{font:400 30px/1.05 var(--font-display);margin-top:6px;text-wrap:balance;text-shadow:0 2px 14px rgba(0,0,0,.55)}
#caption{margin-top:12px;padding:9px 13px 10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#caption .t{font:400 17px/1.2 var(--font-display)}
#caption .s{margin-top:3px;font:700 11px/1.2 var(--font-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

#mini{top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:grid;justify-items:end;gap:7px}
#map{width:92px;height:92px;display:block;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
#count{font:700 12px/1 var(--font-ui);padding:6px 10px;border-radius:99px;background:var(--panel);border:1px solid var(--line)}

#joy{
  pointer-events:auto;touch-action:none;
  left:max(16px,env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));
  width:130px;height:130px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.07) 0 38%,transparent 39%),var(--panel);
  border:1px solid var(--line);
}
#joy::before,#joy::after{content:"";position:absolute;background:var(--line);left:50%;top:50%}
#joy::before{width:1px;height:70%;transform:translate(-50%,-50%)}
#joy::after{height:1px;width:70%;transform:translate(-50%,-50%)}
#knob{position:absolute;z-index:1;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:var(--accent);box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 -6px 0 rgba(0,0,0,.14)}

#touch{
  right:max(16px,env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));
  display:grid;justify-items:center;gap:9px;
}
#touchBtn{
  pointer-events:auto;touch-action:none;
  width:88px;height:88px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;
  background:var(--panel);color:var(--muted);border:2px solid var(--line);
  transition:background .18s,color .18s,border-color .18s,box-shadow .18s,transform .12s;
}
#touchBtn svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#touchBtn .ic-shrink{display:none}
#touchBtn.open .ic-expand{display:none}
#touchBtn.open .ic-shrink{display:block}
#touchBtn.ready{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 0 0 7px rgba(255,179,71,.24)}
#touchBtn:active{transform:scale(.94)}
#touchLabel{font:700 12px/1 var(--font-ui);padding:7px 11px;border-radius:99px;background:var(--panel);border:1px solid var(--line);white-space:nowrap}

#hint{left:50%;transform:translateX(-50%);bottom:calc(168px + env(safe-area-inset-bottom,0px));width:min(calc(100vw - 32px),430px);text-align:center;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;font-size:13px;color:var(--fg);transition:opacity .6s}
#hint.gone{opacity:0}
#toast{left:50%;transform:translateX(-50%);top:46%;padding:9px 15px;background:var(--panel);border:1px solid var(--line);border-radius:99px;font-weight:700;font-size:13px;transition:opacity .25s;opacity:0}
#toast.on{opacity:1}

#loading{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:var(--bg);text-align:center}
#loading .box{display:grid;gap:16px;justify-items:center;padding:0 24px}
#loading .bar{width:150px;height:3px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
#loading .bar::after{content:"";position:absolute;inset:0;width:45%;background:var(--accent);border-radius:3px;animation:slide 1s ease-in-out infinite}
#loading p{margin:0;font:400 20px/1.3 var(--font-display);text-wrap:balance}
#loading.failed .bar{display:none}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
@media (prefers-reduced-motion:reduce){#loading .bar::after{animation:none;width:100%}#hint,#toast{transition:none}}

#gp{left:50%;transform:translateX(-50%);bottom:calc(228px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;pointer-events:auto}
#gp[hidden],#gm[hidden],#mf[hidden],#chp[hidden]{display:none}
#gp button{padding:12px 16px;border-radius:99px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px}
#gm,#mf{position:fixed;inset:0;z-index:20;background:rgba(14,16,22,.97);display:flex;flex-direction:column;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 10px 20px;overflow:auto;touch-action:pan-y}
.gh{display:flex;gap:10px;align-items:center;width:min(94vw,440px)}.gh b{font:400 20px var(--font-display);flex:1}.gh button,#gb .ac,.mfc .ac{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:700}
#gs{width:min(94vw,440px);text-align:center;color:var(--accent);font-weight:700;min-height:20px}
#gb{width:min(94vw,440px);display:grid;gap:10px;justify-items:center}
.bd{display:grid;width:100%;aspect-ratio:1;border:2px solid var(--line)}.bd button{border:0;padding:0;font-size:min(8vw,34px);line-height:1;display:grid;place-items:center;aspect-ratio:1}
.bd.c4{aspect-ratio:7/6}.bd.c4 button{border-radius:50%;margin:3px;background:#0b1740}
.cs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.cd{min-width:46px;padding:12px 6px;border-radius:8px;border:1px solid #888;background:#f3efe6;color:#111;font:700 17px var(--font-ui)}.cd.r{color:#c0272d}.cd.on{outline:3px solid var(--accent)}.cd.off{opacity:.45}
.big{font-size:26px;letter-spacing:2px;text-align:center}

#side{left:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;pointer-events:auto}
#side button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:22px}
#chp{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:21;background:rgba(14,16,22,.96);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:min(92vw,380px)}
#chp button{padding:8px 2px;border-radius:12px;border:2px solid var(--line);background:var(--panel);font-size:11px}#chp button.on{border-color:var(--accent)}#chp i{display:block;font-style:normal;font-size:26px}
.mfc{width:min(94vw,440px);display:grid;gap:10px}.mfc input{padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:inherit;font-size:16px;min-width:0}
.pl{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);text-align:left;color:inherit}.pl.on{border-color:var(--accent)}.pl.dead{opacity:.4}
.er{color:#ff8a8a;min-height:18px}.lg{font-size:13px;max-height:130px;overflow:auto;display:grid;gap:3px}.mfc button:disabled{opacity:.5}

/* chat, mikrofon, emotsiya */
#side{top:calc(158px + env(safe-area-inset-top,0px));transform:none;gap:6px}
#side button{width:42px;height:42px;font-size:20px}
@media (orientation:landscape){#side{top:auto;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:calc(max(16px,env(safe-area-inset-left,0px)) + 146px);flex-direction:row;gap:7px}
  #side button{width:44px;height:44px}#hint{bottom:calc(86px + env(safe-area-inset-bottom,0px))}}
#side button{position:relative}#side button.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,179,71,.28)}
#side button.live{border-color:#5fd38a;box-shadow:0 0 0 3px rgba(95,211,138,.3)}
#side .bg{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:#e0443e;color:#fff;font:700 11px/18px var(--font-ui);text-align:center;display:none}
#cp,#emp{position:fixed;z-index:12;left:50%;transform:translateX(-50%);bottom:calc(170px + env(safe-area-inset-bottom,0px));width:min(92vw,380px);background:rgba(14,16,22,.94);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:8px}
#cp[hidden],#emp[hidden]{display:none}
#cl,#gcl{max-height:min(34vh,200px);overflow:auto;display:grid;gap:3px;font-size:13px;line-height:1.35;touch-action:pan-y;-webkit-user-select:text;user-select:text;align-content:start}
#cl b,#gcl b,#feed b{color:var(--accent)}#cl i,#gcl i{font-style:normal;color:var(--muted)}
.cr{display:flex;gap:6px}.cr input{flex:1;min-width:0;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:inherit;font-size:16px;-webkit-user-select:text;user-select:text}
.cr button{padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:var(--accent);color:var(--accent-ink);font-weight:700}
#feed{position:fixed;z-index:6;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(165px + env(safe-area-inset-bottom,0px));max-width:min(62vw,320px);display:grid;gap:4px;pointer-events:none;font-size:13px}
#feed div{padding:5px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);transition:opacity .6s}
#emp{grid-template-columns:repeat(4,1fr)}#emp button{padding:10px 2px;border-radius:12px;border:2px solid var(--line);background:var(--panel);font-size:12px}#emp i{display:block;font-style:normal;font-size:28px}
#gc{width:min(94vw,440px);display:grid;gap:6px;margin-top:6px}#gc[hidden]{display:none}
#cnick{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}#cnick input{flex:1;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:inherit;font-size:14px;min-width:0;-webkit-user-select:text;user-select:text}

/* ===== GORIZONTAL (landscape) REJIM ===== */
/* Telefon tik turganda: "Telefonni yoting" ekrani (o'tkazib yuborish mumkin) */
#rot{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:var(--bg);text-align:center;padding:24px}
#rot .box{display:grid;gap:14px;justify-items:center;max-width:320px}
#rot svg{width:92px;height:92px;fill:none;stroke:var(--accent);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;animation:rotp 2.6s ease-in-out infinite}
#rot p{margin:0;font:400 22px/1.3 var(--font-display);text-wrap:balance}
#rot small{color:var(--muted);font-size:13px}
#rot button{padding:10px 18px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-weight:700;cursor:pointer}
@keyframes rotp{0%,25%{transform:rotate(0)}65%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){#rot svg{animation:none}}
@media (orientation:portrait) and (pointer:coarse){#rot:not(.off){display:grid}}

/* Past ekran (telefon yotganda balandlik ~300-450px): HUD ixchamlashadi */
@media (orientation:landscape) and (max-height:520px){
  :root{--sb:env(safe-area-inset-bottom,0px);--sl:max(16px,env(safe-area-inset-left,0px));--sr:max(16px,env(safe-area-inset-right,0px))}
  #place{top:calc(8px + env(safe-area-inset-top,0px));max-width:min(42vw,320px)}
  #place .k{font-size:10px}
  #place .n{font-size:22px;margin-top:4px}
  #caption{margin-top:7px;padding:6px 10px 7px}#caption .t{font-size:15px}#caption .s{font-size:10px}
  #mini{top:calc(8px + env(safe-area-inset-top,0px));gap:5px}
  #map{width:72px;height:72px}#count{font-size:11px;padding:5px 9px}
  #joy{width:112px;height:112px;bottom:calc(14px + var(--sb))}
  #knob{width:50px;height:50px;margin:-25px 0 0 -25px}
  #touch{bottom:calc(14px + var(--sb));gap:6px}
  #touchBtn{width:72px;height:72px}#touchBtn svg{width:30px;height:30px}
  #touchLabel{font-size:11px;padding:6px 10px}
  #side{left:calc(var(--sl) + 128px);bottom:calc(14px + var(--sb));gap:6px}
  #side button{width:40px;height:40px;font-size:18px}
  #hint{bottom:calc(64px + var(--sb));width:min(54vw,430px);font-size:12px;padding:7px 12px}
  #gp{bottom:calc(66px + var(--sb))}#gp button{padding:9px 14px;font-size:14px}
  body:has(#gp:not([hidden])) #hint{bottom:calc(116px + var(--sb))}
  #toast{top:30%}
  #feed{left:calc(var(--sl) + 128px);bottom:calc(62px + var(--sb));max-width:min(40vw,320px);font-size:12px}
  #cp,#emp{left:calc(var(--sl) + 128px);transform:none;bottom:calc(62px + var(--sb));width:min(54vw,430px)}
  #cl,#gcl{max-height:min(30vh,110px)}
  #chp{width:min(94vw,640px);max-height:calc(100vh - 20px);overflow:auto;grid-template-columns:repeat(5,1fr);padding:10px;gap:6px}
  #chp button{padding:5px 2px}#chp i{font-size:22px}
  /* o'yin stollari: chapda sarlavha/holat/chat, o'ngda taxta */
  #gm{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);grid-template-rows:auto auto 1fr;grid-template-areas:"h b" "s b" "c b";align-content:start;align-items:start;justify-items:stretch;column-gap:16px;row-gap:8px;
    padding:calc(8px + env(safe-area-inset-top,0px)) var(--sr) 8px var(--sl)}
  #gm .gh{grid-area:h;width:auto}
  #gs{grid-area:s;width:auto;text-align:left}
  #gb{grid-area:b;width:auto;max-height:calc(100vh - 16px);overflow:auto;align-content:start}
  #gc{grid-area:c;width:auto;align-self:end;margin-top:0}
  .bd{width:min(100%,calc(100vh - 100px));margin:0 auto}
  .bd.c4{width:min(100%,calc((100vh - 100px)*7/6))}
  .bd button{font-size:min(5.5vh,28px)}
  .cd{padding:9px 5px}
  .big{font-size:22px}
  /* Mafiya: kengroq va past */
  #mf{padding:calc(8px + env(safe-area-inset-top,0px)) var(--sr) 12px var(--sl)}
  #mf .gh{width:min(100%,640px)}.mfc{width:min(100%,640px)}
  .lg{max-height:90px}
}
/* Telefon yotganda ekran klaviaturasi ochilsa: chat tepaga ko'tariladi */
body.kb #cp{top:calc(6px + var(--vvt,0px));bottom:auto;left:50%;transform:translateX(-50%);width:min(88vw,520px)}
body.kb #cl{max-height:48px}body.kb #cnick{display:none}
body.kb #hint,body.kb #feed{display:none}
</style>

<div id="stage"></div>

<div id="place" class="hud">
  <div class="k" id="pk">1-xona</div>
  <div class="n" id="pn">Tong</div>
  <div id="caption" hidden><div class="t" id="ct"></div><div class="s" id="cs"></div></div>
</div>

<div id="mini" class="hud">
  <svg id="map" viewBox="0 0 32 32" role="img" aria-label="Muzey xaritasi">
    <rect x="0" y="0" width="16" height="16" fill="#4a2f5c"/>
    <rect x="16" y="0" width="16" height="16" fill="#1f5a66"/>
    <rect x="0" y="16" width="16" height="16" fill="#182044"/>
    <rect x="16" y="16" width="16" height="16" fill="#6e2433"/>
    <g stroke="rgba(243,239,230,.75)" stroke-width=".7" fill="none" stroke-linecap="round">
      <path d="M16 0V6M16 10V22M16 26V32M0 16H6M10 16H22M26 16H32"/>
      <rect x=".35" y=".35" width="31.3" height="31.3"/>
    </g>
    <g fill="rgba(243,239,230,.55)" font-size="4.2" font-family="Manrope,system-ui,sans-serif" font-weight="700" text-anchor="middle">
      <text x="8" y="9.6">1</text><text x="24" y="9.6">2</text><text x="24" y="25.6">3</text><text x="8" y="25.6">4</text>
    </g>
    <g id="dots"></g>
  </svg>
  <div id="count">Muzeyda: 1</div>
</div>

<div id="hint" class="hud"></div>
<div id="toast" class="hud" role="status"></div>

<div id="joy" class="hud" aria-label="Harakat joystigi"><div id="knob"></div></div>

<div id="touch" class="hud">
  <div id="touchLabel">Rasmga yaqinlashing</div>
  <button id="touchBtn" type="button" aria-label="Rasmni kattalashtirish yoki joyiga qaytarish">
    <svg class="ic-expand" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10V4h6M20 10V4h-6M4 14v6h6M20 14v6h-6"/></svg>
    <svg class="ic-shrink" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4v6H4M14 4v6h6M10 20v-6H4M14 20v-6h6"/></svg>
  </button>
</div>

<div id="side" class="hud"><button id="bch" title="Personaj">🐾</button><button id="bem" title="Harakat">😄</button><button id="bcc" title="Yozuvli chat">💬<span class="bg" id="bgc"></span></button><button id="bmic" title="Mikrofon">🎤</button><button id="bmute" title="Ovozni o'chirish/yoqish" hidden>🔊</button><button id="bmf" title="Mafiya">🎭</button><button id="bfs" title="To'liq ekran (gorizontal)" hidden>⛶</button></div><div id="feed"></div><div id="cp" hidden><div id="cl"></div><div id="cnick">Ism: <input id="cni" maxlength="16" placeholder="Mehmon" autocomplete="off"></div><div class="cr"><input id="cin" maxlength="160" placeholder="Xabar yozing…" autocomplete="off" enterkeyhint="send"><button id="cis" type="button">➤</button></div></div><div id="emp" hidden></div><div id="chp" hidden></div><div id="mf" hidden></div>
<div id="gp" class="hud" hidden></div>
<div id="gm" hidden><div class="gh"><b id="gt"></b><button id="gx" type="button">Chiqish</button></div><div id="gs"></div><div id="gb"></div><div id="gc" hidden><div id="gcl"></div><div class="cr"><input id="gci" maxlength="160" placeholder="Raqibga xabar…" autocomplete="off" enterkeyhint="send"><button id="gcs" type="button">➤</button></div></div></div>
<div id="loading"><div class="box"><div class="bar"></div><p>Muzey tayyorlanmoqda…</p></div></div>
<div id="rot" role="dialog" aria-label="Telefonni yoting"><div class="box">
  <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="20" y="6" width="24" height="42" rx="4"/><path d="M30 42h4"/></svg>
  <p>Telefonni yoting</p>
  <small>O'yin gorizontal (yotiq) holatda qulayroq ishlaydi.</small>
  <button id="rotgo" type="button">Baribir tik davom etish</button>
</div></div>

<script>
(function(){

/* ------------------------------------------------------------------ helpers */

function rng(seed){var a=seed>>>0;return function(){a=(a+0x6D2B79F5)|0;var t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function hashStr(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

function skyGradient(ctx,W,Hh,stops,until){var g=ctx.createLinearGradient(0,0,0,until);for(var i=0;i<stops.length;i++)g.addColorStop(i/(stops.length-1),stops[i]);ctx.fillStyle=g;ctx.fillRect(0,0,W,Hh);}

function ridge(ctx,W,Hh,base,amps,freqs,phases,fill){
  ctx.fillStyle=fill;ctx.beginPath();ctx.moveTo(0,Hh);
  for(var x=0;x<=W;x+=4){var y=base;for(var k=0;k<amps.length;k++)y-=Math.sin(x*freqs[k]+phases[k])*amps[k];ctx.lineTo(x,y);}

}
function stars(ctx,R,W,maxY,n){

}

function paintFields(ctx,W,Hh,R){
  skyGradient(ctx,W,Hh,["#7fd0d4","#cfeadb","#f6efcf"],Hh*.5);
  glow(ctx,W*(.15+.7*R()),Hh*.2,6,120,"255,246,210",.8);
  var hor=Hh*.5,cx=W/2;
  ridge(ctx,W,Hh,hor-4,[30,14,6],[.012,.03,.07],[R()*6,R()*6,R()*6],"#9db7c9");
  ridge(ctx,W,Hh,hor+4,[16,8,3],[.02,.045,.09],[R()*6,R()*6,R()*6],"#7fa0a8");
  var cols=["#4f8a3c","#79a63f","#c9b548","#e1c36a","#b5622f","#2f6b3a","#9fbf5a","#d49a45"];
  var rows=9;
  function sc(y){return .3+(y-hor)/(Hh-hor)*2.6;}
  for(var i=0;i<rows;i++){
    var ya=hor+(Hh-hor)*Math.pow(i/rows,1.6),yb=hor+(Hh-hor)*Math.pow((i+1)/rows,1.6);
    var sa=sc(ya),sb=sc(yb),ur=cx/sa+40,u=-ur;
    while(u<ur){
      var w=26+R()*60;
      ctx.fillStyle=pickFrom(R,cols);
      ctx.beginPath();ctx.moveTo(cx+u*sa,ya);ctx.lineTo(cx+(u+w)*sa,ya);ctx.lineTo(cx+(u+w)*sb,yb);ctx.lineTo(cx+u*sb,yb);ctx.closePath();ctx.fill();
      ctx.strokeStyle="rgba(20,40,20,.16)";ctx.lineWidth=1;ctx.stroke();
      u+=w;
    }
  }
  var trees=[];
  for(var k=0;k<9;k++){var t=R();trees.push({by:hor+(Hh-hor)*(.06+.3*t*t+.1*R()),bx:W*R()});}
  trees.sort(function(a,b){return a.by-b.by;});
  for(var j=0;j<trees.length;j++){
    var tr=trees[j],s2=.4+(tr.by-hor)/(Hh-hor)*2.2,th=26*s2*2.4;
    ctx.fillStyle="#4a3524";ctx.fillRect(tr.bx-.8*s2,tr.by-2,1.6*s2,4*s2);
    ctx.fillStyle="#1d4026";ctx.beginPath();ctx.ellipse(tr.bx,tr.by-th/2,5.5*s2,th/2,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#2f6b3a";ctx.beginPath();ctx.ellipse(tr.bx-1.2*s2,tr.by-th/2,2.6*s2,th/2.3,0,0,Math.PI*2);ctx.fill();
  }
}

function rosette(ctx,x,y,r,n,c1,c2,bg){
  for(var j=0;j<n;j++){
    ctx.save();ctx.translate(x,y);ctx.rotate(j*Math.PI*2/n);
    ctx.fillStyle=c1;ctx.beginPath();ctx.ellipse(0,-r*.62,r*.22,r*.4,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  disc(ctx,x,y,r*.32,c2);disc(ctx,x,y,r*.15,bg);
}
function paintSuzani(ctx,W,Hh,R){
  var bg=pickFrom(R,["#7a1f2e","#14325c","#0f4a45","#3b1f5a"]);
  var pal=["#e8b84a","#efe6cf","#d95f5f","#45a39a","#7fb069"];
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,Hh);
  ctx.strokeStyle=pal[0];ctx.lineWidth=5;ctx.strokeRect(14,14,W-28,Hh-28);
  ctx.strokeStyle=pal[1];ctx.lineWidth=2;ctx.strokeRect(26,26,W-52,Hh-52);
  for(var i=0;i<20;i++){var px=44+i*((W-88)/19);disc(ctx,px,20,2.4,i%2?pal[2]:pal[0]);disc(ctx,px,Hh-20,2.4,i%2?pal[0]:pal[2]);}
  ctx.strokeStyle=pal[3];ctx.lineWidth=3;
  var cx=W/2,cy=Hh/2,corners=[[70,64],[W-70,64],[70,Hh-64],[W-70,Hh-64]];
  for(var c=0;c<4;c++){
    var cr=corners[c];
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.bezierCurveTo(cx+(cr[0]-cx)*.2,cy+(cr[1]-cy)*.9,cx+(cr[0]-cx)*.8,cy+(cr[1]-cy)*.1,cr[0],cr[1]);ctx.stroke();
    for(var l=1;l<=3;l++){
      var lx=cx+(cr[0]-cx)*l/4,ly=cy+(cr[1]-cy)*l/4+(l%2?-12:12);
      ctx.fillStyle=pal[4];ctx.beginPath();ctx.ellipse(lx,ly,13,5,l%2?-.6:.6,0,Math.PI*2);ctx.fill();
    }
  }
  var a=pickFrom(R,[2,3]),b=pickFrom(R,[0,1,4]);
  rosette(ctx,cx,cy,88,16,pal[a],pal[0],bg);
  rosette(ctx,cx,cy,54,12,pal[1],pal[3],bg);
  for(var q=0;q<4;q++)rosette(ctx,corners[q][0],corners[q][1],34,8,pal[b],pal[2],bg);
  rosette(ctx,cx,56,22,8,pal[0],pal[2],bg);rosette(ctx,cx,Hh-56,22,8,pal[0],pal[2],bg);
  rosette(ctx,60,cy,22,8,pal[0],pal[2],bg);rosette(ctx,W-60,cy,22,8,pal[0],pal[2],bg);
}

function paintNight(ctx,W,Hh,R,idx){
  var type=idx%3,i,x;
  var pals=[["#040818","#14215a","#33468f"],["#060a1c","#1b2a5e","#5a4a86"],["#030710","#0c2038","#1c4a5a"]];
  skyGradient(ctx,W,Hh,pals[type],Hh*.85);
  if(type===0){
    stars(ctx,R,W,Hh*.8,170);
    var mx=W*(.25+.5*R()),my=Hh*(.28+.1*R()),mr=40+18*R();
    glow(ctx,mx,my,mr*.8,mr*5,"200,215,255",.55);
    disc(ctx,mx,my,mr,"#f1eedd");
    for(i=0;i<6;i++){var a=R()*6.283,d=R()*mr*.65;disc(ctx,mx+Math.cos(a)*d,my+Math.sin(a)*d,4+R()*7,"rgba(170,170,160,.35)");}
    ridge(ctx,W,Hh,Hh*.82,[14,7],[.011,.03],[R()*6,R()*6],"#0a1030");
    ridge(ctx,W,Hh,Hh*.9,[10,5],[.017,.04],[R()*6,R()*6],"#050818");
  }else if(type===1){
    stars(ctx,R,W,Hh*.5,70);
    var gx=W*(.2+.6*R());
    glow(ctx,gx,Hh*.2,10,70,"200,215,255",.5);disc(ctx,gx,Hh*.2,20,"#f1eedd");
    var hg=ctx.createLinearGradient(0,Hh*.6,0,Hh);hg.addColorStop(0,"rgba(255,170,90,0)");hg.addColorStop(1,"rgba(255,170,90,.3)");ctx.fillStyle=hg;ctx.fillRect(0,Hh*.6,W,Hh*.4);
    for(var layer=0;layer<2;layer++){
      x=-6;
      while(x<W){
        var w=18+R()*30,h=(layer?36:24)+R()*(Hh*(layer?.45:.35)),top=Hh-h;
        ctx.fillStyle=layer?"#080c1a":"#131b3a";ctx.fillRect(x,top,w,h);
        if(layer){
          for(var wy=top+7;wy<Hh-4;wy+=9)for(var wx=x+4;wx<x+w-5;wx+=8){if(R()<.34){ctx.fillStyle=R()<.8?"#ffd27a":"#9fd0ff";ctx.fillRect(wx,wy,3.5,4.5);}}
        }
        x+=w+(R()<.3?4:0);
      }
    }
  }else{
    stars(ctx,R,W,Hh*.7,140);
    ctx.globalCompositeOperation="lighter";
    for(var bnd=0;bnd<5;bnd++){
      var col=pickFrom(R,[[55,224,160],[70,200,232],[182,107,255],[125,255,176]]);
      var y0=Hh*(.2+.25*R()),amp=14+22*R(),fr=.008+.01*R(),ph=R()*6;
      for(x=0;x<W;x+=3){
        var top2=y0+Math.sin(x*fr+ph)*amp,hh=80*(.6+.4*Math.sin(x*.05+ph));
        var g=ctx.createLinearGradient(0,top2,0,top2+hh);
        g.addColorStop(0,"rgba("+col.join(",")+",.0)");g.addColorStop(.25,"rgba("+col.join(",")+",.2)");g.addColorStop(1,"rgba("+col.join(",")+",0)");
        ctx.fillStyle=g;ctx.fillRect(x,top2,3,hh);
      }
    }
    ctx.globalCompositeOperation="source-over";
    ridge(ctx,W,Hh,Hh*.88,[12,6],[.013,.035],[R()*6,R()*6],"#04080f");
    var hx=W*(.15+.6*R()),hy=Hh*.9;
    ctx.fillStyle="#04080f";ctx.fillRect(hx,hy-14,26,18);ctx.beginPath();ctx.moveTo(hx-4,hy-14);ctx.lineTo(hx+13,hy-27);ctx.lineTo(hx+30,hy-14);ctx.closePath();ctx.fill();
    ctx.fillStyle="#ffd27a";ctx.fillRect(hx+8,hy-9,6,6);
  }
}

function makeFloorCanvas(base){
  var c=canvasEl(512,512),x=c.getContext("2d"),hsl={};new THREE.Color(base).getHSL(hsl);
  var R=rng(hashStr(base)),rows=8,ph=512/rows;
  for(var i=0;i<rows;i++){
    var px=-R()*200;
    while(px<512){
      var len=140+R()*200,l=clamp(hsl.l+(R()-.5)*.09,0,1);
      x.fillStyle="hsl("+Math.round(hsl.h*360)+","+Math.round(hsl.s*100)+"%,"+Math.round(l*100)+"%)";
      x.fillRect(px,i*ph,len,ph);
      x.fillStyle="rgba(0,0,0,.3)";x.fillRect(px,i*ph,len,1.5);x.fillRect(px,i*ph,1.5,ph);
      px+=len;
    }
  }
  for(var g=0;g<90;g++){x.fillStyle="rgba(0,0,0,"+(.02+R()*.04)+")";x.fillRect(R()*512,R()*512,40+R()*120,1);}
  return c;
}

  x.save();x.translate(256,180);
  var cols=[pal[1],pal[0],pal[2],pal[0],"#efe6cf"];

var camTgt=new THREE.Vector3(),camDir=new THREE.Vector3(),camPos=new THREE.Vector3();

function update(dt,time,nowMs){
  /* input -> world direction relative to the camera */
  var ix=joy.x+((keys.d||keys.arrowright)?1:0)-((keys.a||keys.arrowleft)?1:0);
  var iy=joy.y+((keys.w||keys.arrowup)?1:0)-((keys.s||keys.arrowdown)?1:0);
  var len=Math.hypot(ix,iy);if(len>1){ix/=len;iy/=len;len=1;}
  if(len<.14){ix=0;iy=0;len=0;}
  if(keys.q)cam.yaw+=1.9*dt;if(keys.e)cam.yaw-=1.9*dt;
  var sy=Math.sin(cam.yaw),cy=Math.cos(cam.yaw);
  var mx=-sy*iy+cy*ix,mz=-cy*iy-sy*ix,speed=4.1*len;
  var moving=len>0;
  if(moving){
    me.x+=mx/len*speed*dt;me.z+=mz/len*speed*dt;
    collide(me);
    me.ry+=angDiff(me.ry,Math.atan2(mx,mz))*Math.min(1,dt*13);
  }else if(me.faceT>0){
    me.ry+=angDiff(me.ry,me.faceAng)*Math.min(1,dt*12);
  }
  if(me.faceT>0)me.faceT-=dt;
  var mag=len;me.mag+=(mag-me.mag)*Math.min(1,dt*12);
  me.phase+=dt*(speed*2.6);
  var touchAmt=0;
  if(me.touchT>0){me.touchT-=dt;touchAmt=Math.sin(Math.PI*clamp(1-me.touchT/.8,0,1));}
  penguin.root.position.set(me.x,0,me.z);penguin.root.rotation.y=me.ry;
  animateChar(penguin,me.phase,me.mag,time,touchAmt,(window.VOICE&&VOICE.state==='on')?VOICE.level('__me'):0);

  /* camera, pulled in when a wall is in the way */
  camTgt.set(me.x,1.15,me.z);
  camDir.set(Math.sin(cam.yaw)*Math.cos(cam.pitch),Math.sin(cam.pitch),Math.cos(cam.yaw)*Math.cos(cam.pitch));
  camRay.set(camTgt,camDir);camRay.near=0;camRay.far=cam.dist+.4;
  var hits=camRay.intersectObjects(wallMeshes,false),want=cam.dist;
  if(hits.length)want=Math.max(1.7,Math.min(cam.dist,hits[0].distance-.5));
  cam.cur+=(want-cam.cur)*(1-Math.exp(-dt*(want<cam.cur?24:4)));

  if(camPos.y>H-.35)camPos.y=H-.35;
  camera.position.copy(camPos);camera.lookAt(camTgt);

  /* paintings: ease toward their target state */
  var best=-1,bestD=1e9;
  for(var i=0;i<paintings.length;i++){
    var p=paintings[i];
    p.t+=(p.target-p.t)*(1-Math.exp(-dt*7));
    if(Math.abs(p.target-p.t)<.002)p.t=p.target;
    var e=p.t,out=e*1.35;
    p.group.position.set(p.bx+p.nx*out,p.by+Math.sin(time*1.6)*.04*e,p.bz+p.nz*out);
    p.group.scale.setScalar(1+e*.65);

  }
  if(best!==nearIdx||(best>=0&&lastLabel!==(paintings[best].target?"1":"0"))){
    nearIdx=best;
    var cap=$("caption");
    if(best>=0){
      var q=paintings[best];
      $("ct").textContent=q.title;$("cs").textContent=ROOMS[q.room].name+" xonasi  ·  "+(q.i+1)+" / 8";
      cap.hidden=false;btn.classList.add("ready");btn.classList.toggle("open",!!q.target);
      $("touchLabel").textContent=q.target?"Joyiga qaytarish":"Kattalashtirish";
      lastLabel=q.target?"1":"0";
    }else{
      cap.hidden=true;btn.classList.remove("ready","open");$("touchLabel").textContent="Rasmga yaqinlashing";lastLabel="";
    }

  var ri=roomIndexAt(me.x,me.z);
  if(ri!==lastPlace){lastPlace=ri;setPlace(ri);}

  /* other visitors */
  for(var k in remotes){
    var r=remotes[k],ddx=r.tx-r.x,ddz=r.tz-r.z,f=1-Math.exp(-dt*9),ox=r.x,oz=r.z;

    r.ch.root.position.set(r.x,0,r.z);r.ch.root.rotation.y=r.r;
    animateChar(r.ch,r.ph,r.mag,time,0,(window.VOICE&&VOICE.state==='on')?VOICE.level(k):0);
    r.dot.setAttribute("cx",(r.x+16).toFixed(2));r.dot.setAttribute("cy",(r.z+16).toFixed(2));
  }
  meDot.setAttribute("cx",(me.x+16).toFixed(2));meDot.setAttribute("cy",(me.z+16).toFixed(2));
  tickBubbles(nowMs);
  sendPresence(nowMs,moving,false);
}

  var b=st.b.split(""),own=s?"b":"w",res=[],bestS=-1e9,jo=st.f!=null;
  for(var i=0;i<64;i++){if(jo&&i!==st.f)continue;if(b[i]===" "||b[i].toLowerCase()!==own)continue;
    gkm(b,i,jo).forEach(function(m){
      var cap=m[1]>=0,row=m[0]>>3,sc=(cap?20:0)+Math.random()*3+(own==="b"?row:7-row)*.5;
      if((own==="w"&&row===0)||(own==="b"&&row===7))sc+=6;
      /* qo'yilgan joyda yeb ketilmaslik */
      var nb=b.slice();nb[m[0]]=nb[i];nb[i]=" ";if(m[1]>=0)nb[m[1]]=" ";
      for(var q=0;q<64;q++){if(nb[q]===" "||nb[q].toLowerCase()===own)continue;
        gkm(nb,q,0).forEach(function(t){if(t[1]===m[0])sc-=8;});}
      if(sc>bestS){bestS=sc;res=[["s"+i,"s"+m[0]]];}else if(sc===bestS)res.push(["s"+i,"s"+m[0]]);});}
  return res.length?brand(res):[];
};
BOT.mau=function(st,s){
  var top=st.u[st.u.length-1],h=st.h[s],ok=[];
  h.forEach(function(c,i){if(gsu(c)===st.s||grk(c)===grk(top)||grk(c)==="J")ok.push(i);});
  if(!ok.length)return["d"];
  var pri=function(i){var r=grk(h[i]);return r==="7"?3:r==="A"?2:r==="J"?0:1;};
  ok.sort(function(x,y){return pri(y)-pri(x);});
  return["p"+ok[0]];
};
BOT.durak=function(st,s){
  var h=st.h[s],tr=st.tr,un=st.tb.filter(function(x){return!x[1];}),o=1-s;
  var val=function(c){return DR.indexOf(grk(c))+(gsu(c)===tr?20:0);};
  var order=h.map(function(c,i){return i;}).sort(function(x,y){return val(h[x])-val(h[y]);});
  if(st.a===s){
    var rk=[];st.tb.forEach(function(x){rk.push(grk(x[0]));if(x[1])rk.push(grk(x[1]));});
    if(!st.tb.length)return["p"+order[0]];
    if(!un.length&&st.tb.length<6){
      for(var k=0;k<order.length;k++){var i2=order[k];if(rk.indexOf(grk(h[i2]))>=0&&val(h[i2])<20&&st.h[o].length>un.length)return["p"+i2];}
    }
    if(!un.length)return["bito"];
    return[];
  }
  if(!un.length)return[];
  for(var q=0;q<order.length;q++)if(gbeat(h[order[q]],un[0][0],tr))return["p"+order[q]];
  return["take"];
};

function botStep(c){
